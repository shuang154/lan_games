<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>派对游戏大厅</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .lobby-container { text-align: center; max-width: 400px; padding: 20px; }
        .game-card { display: block; background-color: white; padding: 25px; margin-top: 20px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); text-decoration: none; color: #333; transition: all 0.2s ease; }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.12); }
        .game-card h3 { margin: 0 0 8px 0; font-size: 22px; }
        .game-card p { margin: 0; color: #666; }
    </style>
</head>
<body>
    <div class="lobby-container">
        <h1>🎉 派对时间 🎉</h1>
        <p>选择一个游戏开始狂欢吧！</p>

        <a href="/games/pass-the-bomb/" class="game-card">
            <h3>口头炸弹 💣</h3>
            <p>紧张刺激的词语接龙！</p>
        </a>

        <a href="/games/connoisseur-of-lies/" class="game-card">
            <h3>谎言鉴赏家 🧐</h3>
            <p>你无需博学，但要会编！看谁能骗过所有人。</p>
        </a>
    
        <a href="/games/draw-and-guess/" class="game-card">
            <h3>你画我猜 🎨</h3>
            <p>灵魂画手与天才猜手的终极对决。</p>
        </a>






    </div>
</body>
</html>
